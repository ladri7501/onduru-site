<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex,nofollow" />
        <title>ONDURU</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root { --bg:#020617; --card:#0f172a; --line:#1e293b; --line2:#334155; --text:#f1f5f9; --muted:#94a3b8; --em:#34d399; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; background: var(--bg); }
            .staticrypt-content {
                min-height: 100%;
                background: #020617;
                font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--text);
                display: flex;
                align-items: flex-start;
                justify-content: center;
            }
            .staticrypt-page { width: 100%; max-width: 400px; padding: 14vh 16px 40px; box-sizing: border-box; }
            .staticrypt-form {
                position: relative; z-index: 1;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 32px 28px;
                text-align: center;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            }
            .staticrypt-instructions { margin: 0 0 4px; }
            .staticrypt-title { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--em); margin: 0 0 10px; }
            .staticrypt-instructions p:last-child { margin: 0; font-size: 15px; color: var(--text); }
            .staticrypt-hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line2); }
            .staticrypt-password-container {
                position: relative; outline: 0;
                background: #1e293b;
                border: 1px solid var(--line2);
                border-radius: 10px;
                width: 100%; margin: 0 0 12px; box-sizing: border-box;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent; border: 0; box-sizing: border-box;
                font-size: 16px; outline: 0; color: var(--text);
                padding: 14px 44px 14px 14px; width: 100%;
                font-family: inherit; letter-spacing: .04em;
            }
            .staticrypt-form input::placeholder { color: var(--muted); letter-spacing: 0; }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 18px; width: 18px; opacity: .7; padding: 13px;
                position: absolute; right: 0; top: 50%; transform: translateY(-50%);
                filter: invert(1);
            }
            .staticrypt-form .staticrypt-decrypt-button {
                outline: 0; width: 100%; border: 0; border-radius: 10px;
                background: #16a34a;
                padding: 14px; color: var(--bg); font-size: 15px; font-weight: 600;
                cursor: pointer; font-family: inherit;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #16a34a;
                filter: brightness(108%);
            }
            label.staticrypt-remember { display: flex; align-items: center; margin-bottom: 1em; color: var(--muted); font-size: 13px; }
            .staticrypt-remember input[type="checkbox"] { transform: scale(1.2); margin-right: .8em; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg); }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem; vertical-align: text-bottom;
                border: 0.25em solid var(--line2); border-right-color: transparent; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
    </head>
