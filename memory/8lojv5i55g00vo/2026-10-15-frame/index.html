<!doctype html>
<html lang="ko" data-lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="https://onduru.com/">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23eef0f2' stroke-width='3.2' stroke-linecap='round' stroke-dasharray='58 8' transform='rotate(-70 16 16)'/%3E%3C/svg%3E">
  <script>
    (function () {
      var d = document.documentElement, pick = null, tz = '';
      d.classList.add('js');
      var SUP = { ko: 1, en: 1 };
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
      if (tz === 'Asia/Seoul' || tz === 'Asia/Pyongyang') pick = 'ko';
      else {
        var ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
        pick = /^ko\b/i.test(ls[0] || '') ? 'ko' : 'en';
      }
      try { var sv = localStorage.getItem('onduru-lang'); if (sv && SUP[sv]) pick = sv; } catch (e) {}
      var m = location.search.match(/[?&]lang=([a-z]{2})/);
      if (m && SUP[m[1]]) pick = m[1];
      if (!pick) pick = 'en';
      d.setAttribute('data-lang', pick);
      d.setAttribute('data-show', pick === 'ko' ? 'ko' : 'en');
      d.setAttribute('lang', pick === 'nb' ? 'nb' : pick);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --fg: #1d1c1a;
      --muted: #66625a;
      --pencil: #c3bba9;
      --accent: #2f5d50;
      --wash: rgba(47, 93, 80, .07);
      --sky: #05070a;
      --sky-fg: #eef0f2;
      --sky-muted: #8d95a2;
      --signal: #8fd4c1;
      --gutter: clamp(16px, 6vw, 56px);
      --measure: 760px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121311;
        --fg: #e9e6df;
        --muted: #9a968c;
        --pencil: #45463f;
        --accent: #8fbfae;
        --wash: rgba(143, 191, 174, .08);
      }
    }
    :root[data-theme="dark"] {
      --bg: #121311;
      --fg: #e9e6df;
      --muted: #9a968c;
      --pencil: #45463f;
      --accent: #8fbfae;
      --wash: rgba(143, 191, 174, .08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
      font-weight: 300;
      line-height: 1.8;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
    }
    html:not([data-lang="ko"]) body { word-break: normal; }
    ::selection { background: var(--accent); color: var(--bg); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
    button:active, summary:active, a:active { opacity: .6; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* 언어 */
    html[data-show="ko"] .L-en, html[data-show="en"] .L-ko { display: none !important; }
    .langbtn {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 10;
      min-width: 44px; min-height: 44px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .12em;
      color: var(--sky-fg);
      background: rgba(5, 7, 10, .55);
      border: 1px solid rgba(238, 240, 242, .22);
      border-radius: 22px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: border-color .3s, color .3s;
    }
    @media (hover: hover) { .langbtn:hover { border-color: var(--signal); color: var(--signal); } }

    /* ───────── 첫 화면: 밤하늘, 잡음, 신호 ───────── */
    .sky {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      background: transparent;
      color: var(--sky-fg);
      transition: color 2s ease;
      display: flex;
      align-items: center;
      padding: 96px max(var(--gutter), env(safe-area-inset-right)) max(110px, 18vh) max(var(--gutter), env(safe-area-inset-left));
    }
    .sky { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
    .sky ::selection { background: transparent; }
    .sky :focus-visible { outline-color: var(--signal); }
    #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }
    .sky-inner { position: relative; z-index: 1; width: 100%; max-width: 1080px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand > span { font-size: 12px; font-weight: 500; letter-spacing: .42em; }

    .title-wrap { display: grid; margin-top: 36px; }
    .title-wrap > h1, .title-wrap > .stage { grid-area: 1 / 1; }
    .stage { pointer-events: none; }
    .veil { visibility: hidden; }
    .fly { will-change: transform, opacity; }
    h1, .stage-line {
      font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(36px, 8.4vw, 96px);
      line-height: 1.32;
      letter-spacing: -.015em;
    }
    html[data-show="en"] h1, html[data-show="en"] .stage-line { font-size: clamp(34px, 7.4vw, 88px); letter-spacing: -.02em; line-height: 1.18; }
    .w { display: inline-block; white-space: nowrap; }
    .ch { display: inline-block; text-align: center; white-space: pre; will-change: transform; }
    .ch.noise { opacity: .28; }
    .ch.cho { opacity: .62; }
    .ch.lock { animation: lock .9s ease-out; }
    @keyframes lock { from { opacity: .62; } to { opacity: 1; } }

    .sky del {
      color: var(--sky-muted);
      opacity: .85;
      text-decoration: none;
      background: linear-gradient(var(--sky-muted), var(--sky-muted)) no-repeat 0 56% / 100% .06em;
    }
    .js .sky del.pending { background-size: 0 .06em; }
    .sky del.striking { transition: background-size .9s cubic-bezier(.6, .1, .3, 1); background-size: 100% .06em; }
    .sky ins { text-decoration: none; color: inherit; }
    .js .sky ins.pending { visibility: hidden; }
    .mend { display: inline; cursor: pointer; border-radius: 6px; padding: 0 .05em; transition: background-color .3s; }
    .mend[aria-expanded="true"] del { opacity: 1; }
    @media (hover: hover) { .mend:hover del { opacity: 1; } }
.was { margin-top: 26px; font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: clamp(14px, 1.8vw, 17px); color: var(--sky-muted); }
    .was .mend { text-align: left; line-height: 1.7; }
    .margin-note {
      display: none;
      max-width: 34em;
      margin-top: 22px;
      font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.95;
      color: var(--sky-muted);
      border-left: 1px solid rgba(238, 240, 242, .25);
      padding-left: 14px;
    }
    .margin-note.open { display: block; animation: open .6s ease; }

    .signal-line {
      position: relative;
      margin-top: 34px;
      font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif;
      font-size: clamp(17px, 2.4vw, 23px);
      color: var(--sky-fg);
      opacity: .92;
    }
    .js .after-decode { opacity: 0; transform: translateY(8px); transition: opacity 1.2s ease, transform 1.2s ease; }
    .js .after-decode.shown { opacity: 1; transform: none; }
    .who { margin-top: 20px; font-size: 13px; color: var(--sky-muted); letter-spacing: .02em; }
    .who a { color: var(--sky-muted); text-decoration: none; border-bottom: 1px solid rgba(141, 149, 162, .6); transition: color .3s, border-color .3s; }
    .who a:hover, .who a:focus-visible { border-color: currentColor; }
    .down {
      position: absolute; z-index: 1;
      left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 44px; height: 44px;
      display: grid; place-items: center;
      color: var(--sky-muted);
    }
    .down svg { width: 14px; height: 30px; }
    .down path { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
    @media (hover: hover) { .down:hover { color: var(--signal); } }

    /* 미완의 원 */
    .enso { display: inline-flex; width: 44px; height: 44px; padding: 5px; margin: -5px; border-radius: 50%; }
    .enso svg { width: 100%; height: 100%; overflow: visible; }
    .enso circle {
      fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round;
      stroke-dasharray: 232 20; stroke-dashoffset: 252;
      animation: draw 1.4s ease-out .3s forwards;
    }
    .enso.again circle { animation: draw 1.4s ease-out forwards; }
    @media (hover: hover) { .enso:hover circle { stroke: var(--accent); } .sky .enso:hover circle { stroke: var(--signal); } }
    @keyframes draw { from { stroke-dashoffset: 252; } to { stroke-dashoffset: 0; } }

    /* ───────── 본문: 종이 (하늘을 따른다) ───────── */
    body { background: var(--sky-bg, #05070a) fixed; color: var(--sky-fg, #eef0f2); transition: color 2s ease; }
    html { background: var(--sky-solid, #05070a); }
    #air { display: none; position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    main, footer { position: relative; z-index: 1; }
    main .ch.noise { opacity: .28; }
    main .ch.cho { opacity: .62; }
    .sway { display: inline-block; will-change: transform; }
    main { padding: 0 max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }
    .wrap { max-width: var(--measure); margin: 0 auto; }
    .rule { display: block; width: 100%; height: 12px; color: var(--pencil); }
    .rule path { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; vector-effect: non-scaling-stroke; }

    .screen { display: flex; flex-direction: column; justify-content: center; padding: 64px 0; min-height: 100vh; min-height: 100svh; }
    @media (min-width: 900px) and (hover: hover) {
      html { scroll-snap-type: y proximity; }
      .sky, .screen, .block, .end { scroll-snap-align: start; }
    }
    .h72 { min-height: 72vh; min-height: 72svh; }
    .h88 { min-height: 88vh; min-height: 88svh; }
    .h64 { min-height: 64vh; min-height: 64svh; }
    .h80 { min-height: 80vh; min-height: 80svh; }
    .h76 { min-height: 76vh; min-height: 76svh; }
    .i1 { padding-left: clamp(0px, 6%, 48px); }
    .i2 { padding-left: clamp(0px, 2%, 16px); }
    .i3 { padding-left: clamp(0px, 9%, 72px); }
    .line { font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: clamp(21px, 3.6vw, 32px); line-height: 1.85; }
    .line .soft { color: var(--muted); }
    .line.ai { position: relative; padding-left: 26px; }
    .line.ai::before { content: ""; position: absolute; left: 0; top: .95em; width: 14px; border-top: 2px dotted currentColor; opacity: .55; }
    .tag { margin-top: 18px; font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: 14px; letter-spacing: .2em; color: var(--accent); }

    .js .reveal { opacity: 0; transform: translateY(14px); transition: opacity 1.1s ease, transform 1.1s ease; }
    .js .reveal.seen { opacity: 1; transform: none; }

    .block { padding: 72px 0 88px; }
    h2 { font-size: 12px; font-weight: 500; letter-spacing: .3em; color: var(--accent); margin: 40px 0 12px; }
    .hint { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    summary {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 20px;
      align-items: baseline;
      padding: 14px 0;
      cursor: pointer;
      font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif;
      font-size: clamp(17px, 2.6vw, 21px);
      line-height: 1.7;
      border-radius: 4px;
      transition: background-color .3s, box-shadow .3s;
    }
    summary::-webkit-details-marker { display: none; }
    summary b { font-family: "IBM Plex Sans KR", sans-serif; font-weight: 300; font-size: 13px; color: var(--muted); transition: color .3s; }
    summary i {
      justify-self: end; width: 9px; height: 9px;
      border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted);
      transform: rotate(45deg) translateY(-3px);
      transition: transform .4s ease, border-color .3s;
    }
    @media (hover: hover) {
      summary:hover { background: var(--wash); box-shadow: inset 3px 0 var(--accent); }
      summary:hover b { opacity: 1; }
    }
    details[open] summary b { color: var(--fg); }
    details[open] summary i { transform: rotate(225deg) translateY(-2px); border-color: var(--accent); }
    .why { padding: 2px 0 20px 0; font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: clamp(15px, 2.2vw, 17px); line-height: 2; color: var(--muted); }
    details[open] .why { animation: open .6s ease; }
    @keyframes open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .way p { font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: clamp(18px, 3vw, 23px); line-height: 1.95; }

    .end { padding: 88px 0 0; }
    .end .enso { width: 66px; height: 66px; margin: 72px 0 30px -5px; color: var(--fg); }
    .end .line { margin-bottom: 40px; }
    .note { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    a.mail {
      color: var(--fg); text-decoration: none; font-size: 17px; padding-bottom: 2px;
      background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 100% / 100% 1px;
      transition: background-size .5s ease, color .3s;
    }
    a.mail:hover, a.mail:focus-visible { background-size: 100% 2px; }
    .totop { display: inline-grid; place-items: center; margin-top: 40px; min-height: 44px; font-size: 13px; color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
    .totop:hover, .totop:focus-visible { color: var(--fg); }

    footer {
      max-width: calc(var(--measure) + 2 * var(--gutter));
      margin: 96px auto 0;
      padding: 0 max(var(--gutter), env(safe-area-inset-right)) max(56px, env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left));
      font-size: 12px; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center; gap: 0 12px; flex-wrap: wrap;
    }
    .colophon { flex-basis: 100%; border-top: 1px solid var(--pencil); padding-top: 28px; display: grid; gap: 16px; font-size: 13px; line-height: 1.9; }
    .colophon .work { font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: 18px; color: var(--fg); letter-spacing: .04em; }
    .colophon .statement { font-family: "Gowun Batang", "Noto Serif", "Hiragino Mincho ProN", "Songti SC", "Geeza Pro", "Times New Roman", serif; font-size: 15px; color: var(--fg); }
    .colophon .small { font-size: 11.5px; }
    .colophon a.mail { font-size: 14px; }
    footer button { color: var(--muted); text-align: left; line-height: 1.6; padding: 11px 0; }
    footer button > span { border-bottom: 1px dotted var(--muted); }
    @media (hover: hover) { footer button:hover { color: var(--accent); } }
    footer .after { display: none; flex-basis: 100%; }
    footer .after.open { display: block; animation: open .6s ease; }

    @media (max-width: 480px) {
      summary { grid-template-columns: 1fr 16px; }
          }
    @media (max-height: 500px) and (orientation: landscape) {
      .sky { padding-top: 64px; padding-bottom: 64px; }
      .screen { min-height: auto; padding: 56px 0; }
      h1, .stage-line { font-size: clamp(28px, 5vw, 44px) !important; }
      .title-wrap { margin-top: 18px; }
      .signal-line { margin-top: 16px; }
          .down { display: none; }
    }
    @media print {
      .js .reveal, .js .after-decode { opacity: 1; transform: none; }
      .sky { background: #fff; color: #000; min-height: auto; }
      #field, .langbtn, .down { display: none; }
    }
    .snd { position: fixed; right: 18px; bottom: 18px; z-index: 30; width: 40px; height: 40px; padding: 10px; border: 0; background: none; color: var(--fg); opacity: .32; border-radius: 50%; cursor: pointer; transition: opacity .6s; }
    .snd:hover, .snd:focus-visible { opacity: .7; }
    .snd svg { width: 100%; height: 100%; overflow: visible; }
    .snd line { stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
    .snd[aria-pressed="false"] line { stroke-dasharray: 1.5 3; }
    .snd[aria-pressed="true"] { opacity: .55; }
    /* 언어 전환: 소리 버튼 왼쪽, 같은 결. 지금 언어가 조금 더 밝다 */
    .lng { position: fixed; right: 60px; bottom: 18px; z-index: 30; height: 40px; padding: 0 8px; border: 0; background: none; color: var(--fg); opacity: .32; border-radius: 20px; cursor: pointer; transition: opacity .6s; font: 500 11px/40px "IBM Plex Sans KR", system-ui, sans-serif; letter-spacing: .08em; }
    .lng:hover, .lng:focus-visible { opacity: .7; }
    .lng .k, .lng .e { opacity: .5; }
    html[data-show="ko"] .lng .k, html[data-show="en"] .lng .e { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .enso circle, .enso.again circle { animation: none; stroke-dashoffset: 0; }
      .js .reveal, .js .after-decode { opacity: 1; transform: none; transition: none; }
      .ch.lock, details[open] .why, .margin-note.open, footer .after.open { animation: none; }
      summary, summary i, a.mail, .sky del.striking { transition: none; }
    }
  </style>
</head>
<body>

  <button class="snd" type="button" aria-pressed="false"><span class="sr L-ko" data-k="snd"></span><span class="sr L-en" data-k="snd"></span><svg viewBox="0 0 20 20" aria-hidden="true"><line x1="5" y1="7" x2="5" y2="13"/><line x1="10" y1="4" x2="10" y2="16"/><line x1="15" y1="8" x2="15" y2="12"/></svg></button>
  <button class="lng" type="button"><span class="sr L-ko" data-k="lng"></span><span class="sr L-en" data-k="lng"></span><span aria-hidden="true"><span class="k">한</span> / <span class="e">EN</span></span></button>
  <header class="sky" id="top" aria-label="ONDURU" data-scene="0">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="sky-inner">
      <div class="brand">
        <button class="enso" type="button"><span class="sr L-ko" data-k="k02"></span><span class="sr L-en" data-k="k02"></span><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" transform="rotate(-70 50 50)"/></svg></button>
        <span>ONDURU</span>
      </div>

      <div class="title-wrap">
        <h1 class="L-ko" lang="ko" data-k="k03"></h1>
        <h1 class="L-en" lang="en" data-k="k03"></h1>
        <div class="stage" aria-hidden="true"></div>
      </div>
      <p class="was L-ko" lang="ko" data-k="k04"><button class="mend" type="button" aria-expanded="false" aria-controls="n-ko"><del class="pending"></del></button></p>
      <p class="was L-en" lang="en" data-k="k04"><button class="mend" type="button" aria-expanded="false" aria-controls="n-en"><del class="pending"></del></button></p>

      <p class="margin-note L-ko" id="n-ko" role="note" lang="ko" data-k="k05"></p>
      <p class="margin-note L-en" id="n-en" role="note" lang="en" data-k="k05"></p>

      <p class="signal-line after-decode"><span class="L-ko" lang="ko" data-k="k06"></span><span class="L-en" lang="en" data-k="k06"></span></p>
      <p class="who after-decode"><span class="L-ko" lang="ko" data-k="k07"></span><span class="L-en" lang="en" data-k="k07"></span></p>
    </div>
    <a class="down" href="#begin"><span class="sr L-ko" data-k="k08"></span><span class="sr L-en" data-k="k08"></span><svg viewBox="0 0 14 30" aria-hidden="true"><path d="M7 1 C 7.6 10, 6.4 18, 7 28 M2 23 L7 28 L12 23"/></svg></a>
  </header>

  <canvas id="air" aria-hidden="true"></canvas>
  <main>

            setTimeout(function () { if (!on) ac.suspend(); }, 1600);
          },
          hide: function (h) { if (on) { if (h) ac.suspend(); else ac.resume(); } }
        };
      }
      if (sndBtn) {
        sndBtn.addEventListener('click', function () {
          var next = sndBtn.getAttribute('aria-pressed') !== 'true';
          if (next && !snd) snd = makeSound();
          if (!snd) return;
          sndBtn.setAttribute('aria-pressed', next ? 'true' : 'false');
          if (next) snd.start(); else snd.stop();
        });
        document.addEventListener('visibilitychange', function () { if (snd) snd.hide(document.hidden); });
      }

      var started = false;
      function go() { if (started) return; started = true; runHero(); }
      if (document.fonts && document.fonts.ready) {
        setTimeout(go, 1500);
        document.fonts.ready.then(go);
      } else { go(); }
    })();
  </script>
</body>
</html>
