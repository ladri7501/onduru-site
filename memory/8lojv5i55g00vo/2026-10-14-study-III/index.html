<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONDURU — 기억의 장소 · III 습작</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --bg: #1c1b19; --line: 168,162,153; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <script>
    (function () {
      /* III 습작. 직선 하나(정지, 끊긴 자리는 메우지 않는다)와 곡선 하나(천천히 와서 끊긴 자리 위에 머문다).
         검토용 값: ?gap=5|9|14 (끊긴 폭, 화면 폭 %), ?t=초 (곡선이 오는 시간, 기본 360), ?end=1 (머문 뒤의 모습) */
      var q = location.search;
      function num(k, d) { var m = q.match(new RegExp('[?&]' + k + '=([0-9.]+)')); return m ? +m[1] : d; }
      var GAP = num('gap', 9) / 100, DUR = num('t', 360) * 1000;
      var Y = 0.64, X0 = 0.20, X1 = 0.80;          /* 바닥선 */
      var GC = 0.515;                                /* 끊긴 자리의 가운데 */
      var CW = 0.16, SAG = 0.03, LIFT = 0.022;       /* 곡선 폭, 처짐, 바닥선과의 간격(화면 높이 비율) */
      var FROM = 0.28, TO = 0.50;                    /* 곡선 가운데가 오는 길. 끊긴 자리의 정중앙은 비켜 선다 */
      var cv = document.getElementById('c'), cx = cv.getContext('2d'), W, H, t0 = null;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function size() {
        var d = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
      }
      function stroke(w, a) { cx.strokeStyle = 'rgba(' + getComputedStyle(document.documentElement).getPropertyValue('--line').trim() + ',' + a + ')'; cx.lineWidth = w; cx.lineCap = 'butt'; cx.stroke(); }
      function draw(p) {
        cx.clearRect(0, 0, W, H);
        var y = H * Y, g0 = W * (GC - GAP / 2), g1 = W * (GC + GAP / 2);
        cx.beginPath(); cx.moveTo(W * X0, y); cx.lineTo(g0, y); cx.moveTo(g1, y); cx.lineTo(W * X1, y);
        stroke(1.5, 0.9);
        /* 곡선: 일정한 속도. 도착을 알리는 감속은 없다 */
        var c = FROM + (TO - FROM) * p, a = Math.min(1, p * 30) * 0.9;
        var half = W * CW / 2, base = y - H * LIFT - H * SAG, n = 120;
        cx.beginPath();
        for (var i = 0; i <= n; i++) {
          var u = i / n * 2 - 1, x = W * c + u * half, yy = base + H * SAG * (1 - u * u);
          if (i === 0) cx.moveTo(x, base + 0); else cx.lineTo(x, yy);
        }
        stroke(2, a);
      }
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / DUR);
        last = p; draw(p);
        if (p < 1) requestAnimationFrame(frame);
      }
      var fixed = still || /[?&]end=1/.test(q), last = 0;
      window.addEventListener('resize', function () { size(); draw(fixed ? 1 : last); });
      size();
      if (fixed) requestAnimationFrame(function () { size(); draw(1); }); else requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
