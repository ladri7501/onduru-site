<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONDURU — 기억의 장소 · 감정의 스케치 습작</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f4f3ef; --ink: 43,42,40; --soft: #8a8780; }
    @media (prefers-color-scheme: dark) { :root { --paper: #121314; --ink: 232,234,236; --soft: #7d7f82; } }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    .name { position: fixed; left: 0; right: 0; bottom: 9vh; text-align: center; font-family: 'Gowun Batang', serif; color: var(--soft); font-size: 15px; letter-spacing: .3em; transition: opacity 1.2s; pointer-events: none; }
    .name small { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .25em; opacity: .7; }
    .dots { position: fixed; left: 0; right: 0; bottom: 5vh; display: flex; justify-content: center; gap: 10px; }
    .dots button { width: 14px; height: 14px; padding: 4px; border: 0; background: none; cursor: pointer; }
    .dots button i { display: block; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--soft); box-sizing: border-box; }
    .dots button[aria-current="true"] i { background: var(--soft); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="name" id="name" aria-live="polite"></div>
  <nav class="dots" id="dots"></nav>
  <script>
    (function () {
      /* 감정 = 다섯 변수의 조합. 그림은 변수에서만 나온다.
         dir   방향: 두 선 전체의 기울기 (+ 상승, - 하강)
         g0,g1 간격: 왼쪽·오른쪽에서 두 선 사이 거리 (화면 높이 비율). g0→g1 이 관계(평행·수렴·멀어짐)
         gp    간격이 변하는 모양 (1 곧게, >1 끝에서 급히)
         amp,cx,w 곡률: 둘째 선의 솟음(+)·처짐(-), 위치, 폭(작을수록 급함)
         brk   끊김: 0 이어짐 → 1 끊김
         end   둘째 선이 멈추는 자리 (1 끝까지)
         a1,a2 두 선의 진하기 (0 이면 그 선은 없다)
         shake 떨림 */
      var E = [
        { ko: '평온',   en: 'calm',      dir: 0,     g0: .20, g1: .20, gp: 1,   amp: 0,    cx: .5,  w: .2,  brk: 0,   end: 1,   a1: .8, a2: .8, shake: 0 },
        { ko: '그리움', en: 'longing',   dir: 0,     g0: .02, g1: .34, gp: 2.2, amp: 0,    cx: .5,  w: .2,  brk: 0,   end: 1,   a1: .8, a2: .6, shake: 0 },
        { ko: '불안',   en: 'unease',    dir: 0,     g0: .035,g1: .035,gp: 1,   amp: 0,    cx: .5,  w: .2,  brk: .75, end: 1,   a1: .8, a2: .8, shake: 1 },
        { ko: '기쁨',   en: 'joy',       dir: .03,   g0: 0,   g1: 0,   gp: 1,   amp: .2,   cx: .55, w: .2,  brk: 0,   end: 1,   a1: .8, a2: .8, shake: 0 },
        { ko: '슬픔',   en: 'sorrow',    dir: 0,     g0: 0,   g1: 0,   gp: 1,   amp: -.16, cx: .5,  w: .3,  brk: 0,   end: 1,   a1: 0,  a2: .8, shake: 0 },
        { ko: '망설임', en: 'hesitation',dir: 0,     g0: .24, g1: .012,gp: .45, amp: 0,    cx: .5,  w: .2,  brk: 0,   end: .62, a1: .8, a2: .8, shake: .25 }
      ];
      var KEYS = ['dir', 'g0', 'g1', 'gp', 'amp', 'cx', 'w', 'brk', 'end', 'a1', 'a2', 'shake'];
      var cv = document.getElementById('c'), cx = cv.getContext('2d'), nameEl = document.getElementById('name'), dots = document.getElementById('dots');
      var W, H, ink, still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var cur = {}, from = {}, to = E[0], idx = 0, t0 = 0, T = 0, DUR = 2600, HOLD = 7000, lastMove = 0;
      KEYS.forEach(function (k) { cur[k] = E[0][k]; });
      function size() {
        var d = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
        ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
      }
      function ease(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
      function go(i) {
        idx = (i + E.length) % E.length; to = E[idx]; t0 = T; lastMove = T;
        KEYS.forEach(function (k) { from[k] = cur[k]; });
        nameEl.style.opacity = 0;
        setTimeout(function () { nameEl.innerHTML = to.ko + '<small>' + to.en + '</small>'; nameEl.style.opacity = 1; }, 500);
        [].forEach.call(dots.children, function (b, j) { b.setAttribute('aria-current', j === idx ? 'true' : 'false'); });
      }
      E.forEach(function (e, j) {
        var b = document.createElement('button'); b.type = 'button';
        b.innerHTML = '<i></i><span class="sr">' + e.ko + '</span>';
        b.addEventListener('click', function (ev) { ev.stopPropagation(); go(j); });
        dots.appendChild(b);
      });
      /* 바람: 같은 바람이 두 선을 흔든다 */
      function wind(x) { return Math.sin(T * .00042 + x * 2.1) * .55 + Math.sin(T * .00019 + x * 4.7 + 1.3) * .3; }
      function line(f, a, x1, brk, shake, seed) {
        if (a < .01 || x1 < .01) return;
        var L = W * .14, R = W * .86, n = 220, i, x, y;
        cx.beginPath();
        for (i = 0; i <= n; i++) {
          var u = i / n * x1; x = L + (R - L) * u;
          y = f(u) + wind(u) * 2.2 + (shake ? Math.sin(T * .031 + u * 63 + seed) * shake * 1.6 + Math.sin(T * .047 + u * 141) * shake * .8 : 0);
          if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
        }
        if (brk > .02) {
          var seg = 60 - brk * 52, gap = 2 + brk * 13;
          cx.setLineDash([seg, gap]); cx.lineDashOffset = -T * .004 * brk;
        } else cx.setLineDash([]);
        cx.strokeStyle = 'rgba(' + ink + ',' + a + ')';
        cx.lineWidth = 1.4; cx.lineCap = 'round'; cx.lineJoin = 'round';
        cx.stroke();
      }
      function frame(ts) {
        T = ts || 0;
        var p = Math.min(1, (T - t0) / DUR), e = ease(p);
        KEYS.forEach(function (k) { cur[k] = from[k] == null ? to[k] : from[k] + (to[k] - from[k]) * e; });
        if (!still && T - lastMove > HOLD) go(idx + 1);
        cx.clearRect(0, 0, W, H);
        var c = cur, mid = H * .5, span = W * .72;
        /* 첫째 선: 바닥 */
        function A(u) { return mid + c.g0 * H * .5 - c.dir * span * (u - .5); }
        /* 둘째 선: 간격만큼 위, 곡률만큼 솟거나 처짐 */
        function B(u) {
          var g = c.g0 + (c.g1 - c.g0) * Math.pow(Math.min(1, u / Math.max(.05, c.end)), c.gp);
          var bump = c.amp * Math.exp(-Math.pow((u - c.cx) / c.w, 2));
          return A(u) - g * H - bump * H;
        }
        line(A, c.a1, 1, c.brk, c.shake, 0);
        line(B, c.a2, c.end, c.brk, c.shake, 7);
        if (!still) requestAnimationFrame(frame);
      }
      cv.addEventListener('click', function () { go(idx + 1); });
      window.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === ' ') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });
      window.addEventListener('resize', size);
      size();
      var m = location.search.match(/[?&]e=(\d)/);
      go(m ? +m[1] : 0);
      KEYS.forEach(function (k) { from[k] = to[k]; cur[k] = to[k]; });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
